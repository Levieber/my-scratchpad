[install]
# Pin exact versions when adding dependencies (no ^ ranges).
exact = true
# Refuse packages published less than a day ago: most malicious releases are pulled within hours.
minimumReleaseAge = 86400 # 1 day in seconds

[test]
# Only our tests: repos/ vendors upstream projects whose suites run under their own tooling.
root = "test"

[serve.static]
# Compiles Tailwind (scripts/tailwind.ts) in the CSS of the PWA's HTML import (src/web/index.css), in dev and at startup.
plugins = ["./scripts/tailwind.ts"]
